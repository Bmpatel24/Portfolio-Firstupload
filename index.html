            localStorage.setItem(`${DB_VERSION}_pages`, JSON.stringify(DEFAULT_PAGES_DATA));
            localStorage.setItem(`${DB_VERSION}_services`, JSON.stringify(DEFAULT_SERVICES_LIST));
            localStorage.setItem(`${DB_VERSION}_portfolio`, JSON.stringify(DEFAULT_PORTFOLIO_LIST));
            localStorage.setItem(`${DB_VERSION}_testimonials`, JSON.stringify(DEFAULT_TESTIMONIALS_LIST));
            localStorage.setItem(`${DB_VERSION}_packages`, JSON.stringify(DEFAULT_PACKAGES_LIST));
            localStorage.setItem(`${DB_VERSION}_blogs`, JSON.stringify(DEFAULT_BLOGS_LIST));
            localStorage.setItem(`${DB_VERSION}_leads`, JSON.stringify(DEFAULT_LEADS_LIST));
            localStorage.setItem(`${DB_VERSION}_settings`, JSON.stringify(DEFAULT_SETTINGS_DATA));
            localStorage.setItem(`${DB_VERSION}_categories`, JSON.stringify(["SEO", "Seasonal Campaigns", "Branding", "Social Media", "Video & Reels"]));
            localStorage.setItem(`${DB_VERSION}_adminPassword`, "admin123");
        }

        const parseOrDef = (key, def) => {
            const data = localStorage.getItem(`${DB_VERSION}_${key}`);
            if (!data) return def;
            try { return JSON.parse(data) || def; } catch(e) { return def; }
        };

        state.brand = parseOrDef("brand", DEFAULT_BRAND_DATA);
        state.pages = parseOrDef("pages", DEFAULT_PAGES_DATA);
        state.services = parseOrDef("services", DEFAULT_SERVICES_LIST);
        state.portfolio = parseOrDef("portfolio", DEFAULT_PORTFOLIO_LIST);
        state.testimonials = parseOrDef("testimonials", DEFAULT_TESTIMONIALS_LIST);
        state.packages = parseOrDef("packages", DEFAULT_PACKAGES_LIST);
        state.blogs = parseOrDef("blogs", DEFAULT_BLOGS_LIST);
        state.leads = parseOrDef("leads", DEFAULT_LEADS_LIST);
        state.categories = parseOrDef("categories", ["SEO", "Seasonal Campaigns", "Branding", "Social Media", "Video & Reels"]);
        state.settings = parseOrDef("settings", DEFAULT_SETTINGS_DATA);
        state.adminPassword = localStorage.getItem(`${DB_VERSION}_adminPassword`) || "admin123";

        if (sessionStorage.getItem("growwith_admin_logged_in") === "true") {
            state.isLoggedIn = true;
        }
    } catch (e) {
        console.error("Database seed failed, applying defaults:", e);
        state.brand = DEFAULT_BRAND_DATA;
        state.pages = DEFAULT_PAGES_DATA;
        state.services = DEFAULT_SERVICES_LIST;
        state.portfolio = DEFAULT_PORTFOLIO_LIST;
        state.testimonials = DEFAULT_TESTIMONIALS_LIST;
        state.packages = DEFAULT_PACKAGES_LIST;
        state.blogs = DEFAULT_BLOGS_LIST;
        state.leads = DEFAULT_LEADS_LIST;
        state.settings = DEFAULT_SETTINGS_DATA;
    }
};

const saveDb = (key, val) => {
    try {
        localStorage.setItem(`${DB_VERSION}_${key}`, JSON.stringify(val));

    state[key] = val;
};

window.triggerToast = (msg) => {

    renderApp();
    setTimeout(() => {
        state.toasts = state.toasts.filter(t => t.id !== id);

const isPageActive = (id) => {
    const p = state.pages.find(p => p.id === id);
    return p ? p.active : false;
};

const isSectionActive = (pageId, sectionId) => {
    const p = state.pages.find(p => p.id === pageId);
    if (!p || !p.active) return false;
    const s = p.sections.find(s => s.id === sectionId);
    return s ? s.active : false;
};

// Testimonials Slider control
window.slideTestimonial = (direction) => {
    const activeTest = state.testimonials.filter(t => t.show);
    if (activeTest.length === 0) return;
    if (direction === "next") {
        state.testimonialIdx = (state.testimonialIdx === activeTest.length - 1) ? 0 : state.testimonialIdx + 1;
    } else {
        state.testimonialIdx = (state.testimonialIdx === 0) ? activeTest.length - 1 : state.testimonialIdx - 1;
    }
    renderApp();
};

                                                <button class="order-btn" ${sIdx === p.sections.length - 1 ? 'disabled' : ''} onclick="window.reorderSection('${p.id}', ${sIdx}, 'down')">${getIcon('arrowDown', 12)}</button>
                                            </div>
                                            <label class="switch">
                                                <input type="checkbox" ${s.active ? 'checked' : ''} onchange="window.toggleCmsSection('${p.id}', '${s.id}')" />
                                                <span class="slider"></span>
                                            </label>
                                        </div>
                                    </div>
                                `).join("")}
                            </div>
                        </div>
                    ` : ""}
                </div>
            `).join("")}
        </div>
    `;
};

window.toggleCmsPage = (id) => {
    state.pages = state.pages.map(p => p.id === id ? { ...p, active: !p.active } : p);
    saveDb("pages", state.pages);
    triggerToast("Page settings updated.");
};

window.toggleCmsSection = (pId, sId) => {
    state.pages = state.pages.map(p => {
        if (p.id === pId) {
            const updated = p.sections.map(s => s.id === sId ? { ...s, active: !s.active } : s);
            return { ...p, sections: updated };
        }
        return p;
    });
    saveDb("pages", state.pages);
    triggerToast("Section visibility updated.");
};

window.reorderSection = (pId, idx, direction) => {
    const page = state.pages.find(p => p.id === pId);
    const newIdx = direction === "up" ? idx - 1 : idx + 1;
    const sects = [...page.sections];
    
    const temp = sects[idx];
    sects[idx] = sects[newIdx];
    sects[newIdx] = temp;

    state.pages = state.pages.map(p => p.id === pId ? { ...p, sections: sects } : p);
    saveDb("pages", state.pages);
    triggerToast("Layout sequence updated.");
};

        <div class="admin-panel-card">
            <div class="leads-table-container">
                <table class="leads-table">
                    <thead>
                        <tr>
                            <th>Thumbnail</th>
                            <th>Blog Title</th>
                            <th>Category</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${state.blogs.map(b => `
                            <tr>
                                <td><img src="${b.thumbnail}" style="width:40px; height:40px; object-fit:cover; border-radius:4px" onerror="this.src='https://images.unsplash.com/photo-1434030216411-0b793f4b4173?q=80&w=150'" /></td>
                                <td><strong>${b.title}</strong></td>
                                <td>${b.category}</td>
                                <td><span class="status-badge ${b.status === 'published' ? 'published' : 'draft'}">${b.status}</span></td>
                                <td>
                                    <div style="display:flex; gap:0.5rem">
                                        <button class="btn-icon" style="color:var(--primary-gold)" onclick="state.editingBlogId=${b.id}; renderApp();">${getIcon('edit', 14)}</button>
                                        <button class="btn-icon btn-icon-danger" onclick="window.deleteCmsBlog(${b.id})">${getIcon('trash', 14)}</button>
                                    </div>
                                </td>
                            </tr>
                        `).join("")}
                    </tbody>
                </table>
            </div>
        </div>
    `;
};

window.saveCmsBlog = (e, editId) => {
    e.preventDefault();
    const today = new Date();
    const formattedDate = today.toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" });

    const newPost = {
        title: document.getElementById("blg-title").value,
        category: document.getElementById("blg-category").value,
        thumbnail: document.getElementById("blg-thumb").value,
        readTime: document.getElementById("blg-time").value,
        content: document.getElementById("blg-content").value,
        status: document.getElementById("blg-status").value,
        date: formattedDate
    };

    if (editId === "new") {
        newPost.id = Date.now();
        state.blogs.push(newPost);
    } else {
        const idNum = parseInt(editId, 10);
        const oldPost = state.blogs.find(b => b.id === idNum);
        newPost.id = idNum;
        newPost.date = oldPost ? oldPost.date : formattedDate;
        state.blogs = state.blogs.map(b => b.id === idNum ? newPost : b);
    }

    saveDb("blogs", state.blogs);
    state.editingBlogId = null;
    triggerToast("Blog post saved!");
};

window.deleteCmsBlog = (id) => {
    if (confirm("Delete this blog post?")) {
        state.blogs = state.blogs.filter(b => b.id !== id);
        saveDb("blogs", state.blogs);
        triggerToast("Post deleted.");
    }
};

window.deleteCmsLead = (id) => {
    if (confirm("Delete this lead log?")) {
        state.leads = state.leads.filter(l => l.id !== id);
        saveDb("leads", state.leads);
        triggerToast("Lead log removed.");
    }
};

window.downloadLeadsCSV = () => {
    let csv = "Date,Name,Business,WhatsApp,Service,Message\n";
    state.leads.forEach(l => {
        csv += `"${l.date}","${l.name}","${l.businessName}","${l.whatsappNumber}","${l.service}","${l.message}"\n`;
    });
    
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.setAttribute('href', url);
    a.setAttribute('download', 'GrowWith_Leads.csv');
    a.click();
    triggerToast("CSV Download Initiated.");
};

/* ==========================================================================
   DOM INITIALIZER & MOUNTER
   ========================================================================== */
const renderApp = () => {
    try {
        const rootEl = document.getElementById("root");
        if (!rootEl) return;
        
        rootEl.innerHTML = `
            <div class="app-container">
                ${buildHeader()}
                <main style="flex-grow: 1">
                    ${buildBody()}
                </main>
                ${buildFooter()}
                
                <!-- Toast notification log -->
                <div class="toast-container">
                    ${state.toasts.map(t => `
                        <div class="toast">
                            <span style="color:var(--primary-gold)">✓</span>
                            <span>${t.message}</span>
                        </div>
                    `).join("")}
                </div>
            </div>
        `;
    } catch(e) {
        console.error("DOM rendering failed:", e);
        const rootEl = document.getElementById("root");
        if (rootEl) {
            rootEl.innerHTML = `
                <div style="background:#080808; color:#fff; font-family:sans-serif; text-align:center; padding:10rem 2rem">
                    <h2 style="color:#ff5f6d; margin-bottom:1rem">Website Render Stalled</h2>
                    <p style="color:#8E8E8E; margin-bottom:2.5rem; max-width:500px; margin-left:auto; margin-right:auto">
                        This is usually caused by outdated or corrupt data in the browser cache database.
                    </p>
                    <button onclick="window.resetDatabase()" style="background:#C9A84C; color:#000; border:none; padding:1rem 2.5rem; cursor:pointer; font-weight:600">
                        Reset Database Cache & Reload
                    </button>
                </div>
            `;
        }
    }
};

// App Initialization
window.onload = () => {
    loadDatabase();
    applyStyles();
    
    // Simple path hash router
    const handleRoute = () => {
        const hash = window.location.hash;
        if (hash === "#admin") {
            state.route = "admin";
        } else if (hash.startsWith("#blog-post/")) {
            state.selectedBlogPostId = parseInt(hash.replace("#blog-post/", ""), 10);
            state.route = "blog-post";
        } else if (hash) {
            state.route = hash.replace("#", "");
        } else {
            state.route = "home";
        }
        window.scrollTo(0, 0);
        renderApp();
    };
    
    window.addEventListener("hashchange", handleRoute);
    handleRoute(); // Run initially
};

    </script>
